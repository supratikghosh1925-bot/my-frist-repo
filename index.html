<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:Arial,sans-serif;color:#fff;text-align:center;overflow:hidden;
    background:linear-gradient(-45deg,#0f2027,#2c5364,#6a11cb,#ff0080);
    background-size:400% 400%;animation:bg 12s ease infinite;
  }
  @keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .bubble{
    position:absolute;bottom:-60px;border-radius:50%;
    background:rgba(255,255,255,.15);animation:rise linear infinite;
  }
  @keyframes rise{to{transform:translateY(-120vh);opacity:0}}

  .card{
    position:relative;z-index:2;padding:40px 25px;width:90%;max-width:480px;
    background:rgba(255,255,255,.1);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.25);border-radius:24px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
    animation:pop 1.2s ease both;
  }
  @keyframes pop{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}

  h1{
    font-size:2.4rem;margin-bottom:10px;
    animation:glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow{
    from{text-shadow:0 0 8px #fff,0 0 16px #ff0080}
    to{text-shadow:0 0 16px #fff,0 0 32px #6a11cb}
  }

  .typing{
    font-size:1.1rem;min-height:30px;margin:15px 0 25px;color:#e8e8ff;
  }
  .typing span{border-right:2px solid #fff;animation:blink .7s infinite}
  @keyframes blink{50%{border-color:transparent}}

  .btn{
    position:relative;overflow:hidden;display:inline-block;
    padding:14px 34px;border:none;border-radius:50px;cursor:pointer;
    font-size:1rem;font-weight:bold;color:#fff;
    background:linear-gradient(45deg,#ff0080,#6a11cb);
    box-shadow:0 0 20px rgba(255,0,128,.6);
    animation:pulse 2s infinite;
  }
  .btn::after{
    content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.5),transparent);
    animation:shine 3s infinite;
  }
  @keyframes shine{to{left:150%}}
  @keyframes pulse{50%{transform:scale(1.06)}}
</style>
</head>
<body>

<div class="card">
  <h1>Welcome 👋</h1>
  <div class="typing"><span id="text"></span></div>
  <button class="btn" onclick="hello()">Get Started</button>
</div>

<script>
  // Floating bubbles
  for(let i=0;i<25;i++){
    const b=document.createElement("div");
    b.className="bubble";
    const s=Math.random()*50+10;
    b.style.width=b.style.height=s+"px";
    b.style.left=Math.random()*100+"%";
    b.style.animationDuration=(Math.random()*10+6)+"s";
    b.style.animationDelay=(Math.random()*8)+"s";
    document.body.appendChild(b);
  }

  // Typing effect
  const lines=["Main Supratik hoon","Ye meri pehli website hai","Aapka swagat hai! 🚀"];
  let l=0,c=0,del=false;
  const el=document.getElementById("text");
  function type(){
    const t=lines[l];
    el.textContent=t.substring(0,c);
    if(!del){ c++; if(c>t.length){del=true;return setTimeout(type,1200);} }
    else{ c--; if(c<0){del=false;c=0;l=(l+1)%lines.length;} }
    setTimeout(type,del?40:90);
  }
  type();

  function hello(){ alert("Welcome to my website! 🎉"); }
</script>
</body>
</html>
